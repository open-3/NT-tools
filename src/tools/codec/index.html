<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <title>编码转换</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="u-head">
        <span class="u-title">编码转换</span>
        <div class="u-actions">
          <button class="u-btn" id="btn-swap" title="交换输入输出">⇅ 交换</button>
          <button class="u-btn" id="btn-copy" disabled>复制结果</button>
        </div>
      </header>
      <div class="u-body">
        <div class="u-field">
          <label class="u-label">转换类型</label>
          <select class="u-input" id="mode">
            <option value="uni2cn">Unicode (\uXXXX) → 中文</option>
            <option value="cn2uni">中文 → Unicode (\uXXXX)</option>
            <option value="urlenc">URL 编码 (encodeURIComponent)</option>
            <option value="urldec">URL 解码 (decodeURIComponent)</option>
            <option value="b64enc">Base64 编码</option>
            <option value="b64dec">Base64 解码</option>
            <option value="hexenc">Hex 编码</option>
            <option value="hexdec">Hex 解码</option>
          </select>
        </div>
        <div class="u-field">
          <label class="u-label">输入</label>
          <textarea class="u-input" id="inp" rows="6" placeholder="粘贴要转换的内容…"></textarea>
        </div>
        <div class="u-row" style="margin-bottom:14px;">
          <button class="u-btn primary" id="btn-run" style="flex:1;">转换 ↓</button>
        </div>
        <div class="u-field">
          <label class="u-label">输出</label>
          <textarea class="u-input" id="out" rows="6" readonly placeholder="结果…"></textarea>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>

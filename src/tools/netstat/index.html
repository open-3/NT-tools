<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <title>端口进程</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="u-head">
        <span class="u-title">端口进程</span>
        <div class="u-actions">
          <button class="u-btn primary" id="btn-refresh">刷新</button>
          <button class="u-btn" id="btn-tab-ports">监听端口</button>
          <button class="u-btn" id="btn-tab-procs">进程列表</button>
        </div>
      </header>
      <div class="u-body" style="padding:0;">
        <!-- 搜索框 -->
        <div style="padding:10px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);">
          <input class="u-input" id="filter" type="text" placeholder="筛选端口 / 进程名 / PID…" style="flex:1;height:30px;font-size:12px;" />
          <span class="u-label" id="count" style="margin:0;flex:none;">—</span>
        </div>
        <!-- 表格容器 -->
        <div style="flex:1;min-height:0;overflow:auto;">
          <table id="table" style="border-collapse:collapse;font-size:12px;font-family:var(--mono);width:100%;"></table>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>

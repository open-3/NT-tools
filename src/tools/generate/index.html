<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <title>随机生成</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="u-head">
        <span class="u-title">随机生成</span>
        <div class="u-actions">
          <button class="u-btn primary" id="btn-gen">重新生成</button>
          <button class="u-btn" id="btn-copy">复制全部</button>
        </div>
      </header>
      <div class="u-body">
        <div class="u-field">
          <label class="u-label">生成数量</label>
          <input class="u-input" id="count" type="number" value="1" min="1" max="100" style="width:120px;" />
        </div>

        <div class="u-field">
          <label class="u-label">UUID v4</label>
          <div class="u-card" id="uuid-out"></div>
        </div>

        <div class="u-field">
          <label class="u-label">随机密码</label>
          <div class="u-row">
            <input class="u-input" id="pw-len" type="number" value="16" min="4" max="128" style="width:110px;" />
            <span style="font-size:12px;color:var(--t3);">位</span>
            <label style="font-size:12px;display:flex;align-items:center;gap:4px;margin-left:8px;">
              <input type="checkbox" id="pw-symbols" checked /> 含符号
            </label>
          </div>
          <div class="u-card" id="pw-out" style="margin-top:8px;"></div>
        </div>

        <div class="u-field">
          <label class="u-label">随机 Token（hex，32 字节）</label>
          <div class="u-card" id="token-out"></div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data: blob:;" />
    <title>二维码</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="u-head">
        <span class="u-title">二维码</span>
        <div class="u-actions">
          <button class="u-btn" id="btn-clear-gen" title="清空生成文本">清空</button>
        </div>
      </header>
      <div class="u-body">
        <div class="u-field">
          <label class="u-label">文本生成二维码（实时）</label>
          <textarea class="u-input" id="gen-text" rows="3" placeholder="输入文本或 URL，自动生成二维码…"></textarea>
        </div>
        <div class="u-card" style="text-align:center;">
          <canvas id="qr-canvas" width="260" height="260" style="border-radius:6px;background:#fff;"></canvas>
        </div>
        <div class="u-row" style="margin-bottom:16px;">
          <button class="u-btn primary" id="btn-save-qr" style="flex:1;" disabled>保存二维码图片</button>
        </div>

        <div style="border-top:1px solid var(--line);margin:0 0 14px;"></div>

        <div class="u-field">
          <label class="u-label">识别二维码（选择图片）</label>
          <button class="u-btn" id="btn-decode">选择二维码图片</button>
        </div>
        <div class="u-field">
          <label class="u-label">识别结果</label>
          <div class="u-card" id="decode-result"><span class="u-empty">尚未识别</span></div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
